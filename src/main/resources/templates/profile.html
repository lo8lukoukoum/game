<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>个人资料</title>
</head>
<body>

<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2>个人资料</h2>
            <hr>
            <div th:if="${user != null}">
                <dl class="row">
                    <dt class="col-sm-3">用户ID</dt>
                    <dd class="col-sm-9" th:text="${user.id}">123</dd>

                    <dt class="col-sm-3">用户名</dt>
                    <dd class="col-sm-9" th:text="${user.username}">username</dd>

                    <dt class="col-sm-3">邮箱</dt>
                    <dd class="col-sm-9" th:text="${user.email}">email@example.com</dd>

                    <dt class="col-sm-3">注册时间</dt>
                    <dd class="col-sm-9" th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm:ss')}">2023-01-01 10:00:00</dd>

                    <dt class="col-sm-3">角色</dt>
                    <dd class="col-sm-9">
                        <ul>
                            <li th:each="role : ${user.roles}" th:text="${role.name}">角色名</li>
                        </ul>
                    </dd>
                </dl>
                <!-- Add link to edit profile if functionality exists -->
                <!-- <a th:href="@{/profile/edit}" class="btn btn-primary">编辑资料</a> -->
            </div>
            <div th:if="${user == null}" class="alert alert-warning">
                无法加载用户信息。
            </div>
        </div>
    </div>
</div>

</body>
</html>
