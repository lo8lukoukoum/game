<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>用户管理</title>
</head>
<body>

<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="admin-page-title">用户管理</h1>
        <!-- No "Add New User" through UI for now, registration is public -->
    </div>
    <!-- <hr> Replaced by border-bottom in admin-page-title -->

    <table class="table table-striped table-hover admin-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>用户名</th>
                <th>邮箱</th>
                <th>角色</th>
                <th>注册时间</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.id}">1</td>
                <td th:text="${user.username}">testuser</td>
                <td th:text="${user.email}">user@example.com</td>
                <td>
                    <span th:each="role, iterStat : ${user.roles}" th:text="${role.name} + (${!iterStat.last} ? ', ' : '')">角色</span>
                </td>
                <td th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}">2023-01-01 10:00</td>
                <td>
                    <a th:href="@{/admin/users/edit/{id}(id=${user.id})}" class="btn btn-warning btn-sm me-1"><i class="bi bi-person-check-fill me-1"></i>编辑角色</a>
                    <a th:href="@{/admin/users/delete/{id}(id=${user.id})}" class="btn btn-danger btn-sm"
                       th:if="${session.loggedInUser != null && session.loggedInUser.id != user.id}"
                       onclick="return confirm('确定要删除这个用户吗？');"><i class="bi bi-trash-fill me-1"></i>删除</a>
                </td>
            </tr>
        </tbody>
    </table>
    <div th:if="${users.isEmpty()}" class="alert alert-info">
        <p>目前没有用户。</p>
    </div>
</div>

</body>
</html>
