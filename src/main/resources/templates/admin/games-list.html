<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"> <!-- Assuming admin pages use the same main layout -->
<head>
    <title>游戏管理</title>
</head>
<body>

<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1 class="admin-page-title">游戏管理</h1>
        <a th:href="@{/admin/games/new}" class="btn btn-success">
            <i class="bi bi-plus-circle-fill me-1"></i> 添加新游戏
        </a>
    </div>
    <!-- <hr> Replaced by border-bottom in admin-page-title -->

    <table class="table table-striped table-hover admin-table">
        <thead>
            <tr>
                <th>ID</th>
                <th>游戏名称</th>
                <th>分类</th>
                <th>发行日期</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="game : ${games}">
                <td th:text="${game.id}">1</td>
                <td th:text="${game.name}">游戏示例</td>
                <td th:text="${game.category != null ? game.category.name : 'N/A'}">分类示例</td>
                <td th:text="${#temporals.format(game.releaseDate, 'yyyy-MM-dd')}">2023-01-01</td>
                <td>
                    <a th:href="@{/games/{id}(id=${game.id})}" class="btn btn-info btn-sm me-1" target="_blank"><i class="bi bi-eye-fill me-1"></i>查看</a>
                    <a th:href="@{/admin/games/edit/{id}(id=${game.id})}" class="btn btn-warning btn-sm me-1"><i class="bi bi-pencil-square me-1"></i>编辑</a>
                    <a th:href="@{/admin/games/delete/{id}(id=${game.id})}" class="btn btn-danger btn-sm"><i class="bi bi-trash-fill me-1"></i>删除</a>
                </td>
            </tr>
        </tbody>
    </table>
    <div th:if="${games.isEmpty()}" class="alert alert-info">
        <p>目前没有游戏。</p>
    </div>
</div>

</body>
</html>
