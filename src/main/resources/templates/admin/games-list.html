<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"> <!-- Assuming admin pages use the same main layout -->
<head>
    <title>游戏管理</title>
</head>
<body>

<div layout:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>游戏管理</h1>
        <a th:href="@{/admin/games/new}" class="btn btn-success">
            <i class="bi bi-plus-circle"></i> 添加新游戏
        </a>
    </div>
    <hr>

    <table class="table table-striped table-hover">
        <thead>
            <tr>
                <th>ID</th>
                <th>游戏名称</th>
                <th>分类</th>
                <th>发行日期</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="game : ${games}">
                <td th:text="${game.id}">1</td>
                <td th:text="${game.游戏名称}">游戏示例</td>
                <td th:text="${game.游戏分类 != null ? game.游戏分类.分类名称 : 'N/A'}">分类示例</td>
                <td th:text="${#temporals.format(game.发行日期, 'yyyy-MM-dd')}">2023-01-01</td>
                <td>
                    <a th:href="@{/games/{id}(id=${game.id})}" class="btn btn-info btn-sm" target="_blank">查看</a>
                    <a th:href="@{/admin/games/edit/{id}(id=${game.id})}" class="btn btn-primary btn-sm">编辑</a>
                    <a th:href="@{/admin/games/delete/{id}(id=${game.id})}" class="btn btn-danger btn-sm"
                       onclick="return confirm('确定要删除这个游戏吗？相关的评论、评分和收藏也会受到影响。');">删除</a>
                </td>
            </tr>
        </tbody>
    </table>
    <div th:if="${games.isEmpty()}" class="alert alert-info">
        <p>目前没有游戏。</p>
    </div>
</div>

</body>
</html>
