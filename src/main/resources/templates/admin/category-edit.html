<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title th:text="${category.id == null ? '添加新分类' : '编辑分类'}">分类表单</title>
</head>
<body>

<div layout:fragment="content">
    <h1 class="admin-page-title" th:text="${category.id == null ? '添加新分类' : '编辑分类: ' + category.name}">分类表单</h1>
    <!-- <hr> Replaced by border-bottom in admin-page-title -->
    <form th:action="${category.id == null ? '/admin/categories/new' : '/admin/categories/edit'}" th:object="${category}" method="post">
        <input type="hidden" th:field="*{id}" th:if="${category.id != null}" />
         <input type="hidden" th:field="*{createdAt}" th:if="${category.id != null}" />

        <div class="mb-3">
            <label for="categoryName" class="form-label">分类名称</label>
            <input type="text" class="form-control" id="categoryName" th:field="*{name}" required>
        </div>
        <div class="mb-3">
            <label for="description" class="form-label">描述</label>
            <textarea class="form-control" id="description" rows="3" th:field="*{description}"></textarea>
        </div>

        <div class="mt-4"> <!-- Added wrapper for button spacing -->
            <button type="submit" class="btn btn-primary me-2">
                 <i th:class="${category.id == null ? 'bi bi-plus-circle-fill me-1' : 'bi bi-check-circle-fill me-1'}"></i>
                 <span th:text="${category.id == null ? '创建分类' : '保存更改'}">提交</span>
            </button>
            <a th:href="@{/admin/categories-list}" class="btn btn-secondary"><i class="bi bi-x-circle me-1"></i>取消</a>
        </div>
    </form>
</div>

</body>
</html>
