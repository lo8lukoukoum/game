<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>编辑用户</title>
</head>
<body>

<div layout:fragment="content">
    <h1>编辑用户: <span th:text="${user.username}">用户名</span></h1>
    <hr>

    <div class="row">
        <div class="col-md-6">
            <h4>用户信息</h4>
            <dl class="row">
                <dt class="col-sm-4">ID:</dt>
                <dd class="col-sm-8" th:text="${user.id}"></dd>
                <dt class="col-sm-4">用户名:</dt>
                <dd class="col-sm-8" th:text="${user.username}"></dd>
                <dt class="col-sm-4">邮箱:</dt>
                <dd class="col-sm-8" th:text="${user.email}"></dd>
                <dt class="col-sm-4">注册时间:</dt>
                <dd class="col-sm-8" th:text="${#temporals.format(user.createdAt, 'yyyy-MM-dd HH:mm')}"></dd>
            </dl>
        </div>

        <div class="col-md-6">
            <h4>用户角色管理</h4>
            <form th:action="@{/admin/users/update-roles}" method="post">
                <input type="hidden" name="userId" th:value="${user.id}" />
                <div class="mb-3">
                    <label class="form-label">分配角色:</label>
                    <div th:each="role : ${allRoles}" class="form-check">
                        <input class="form-check-input" type="checkbox" name="roleIds"
                               th:value="${role.id}" th:id="'role_' + ${role.id}"
                               th:checked="${userRoleIds.contains(role.id)}">
                        <label class="form-check-label" th:for="'role_' + ${role.id}" th:text="${role.name}">
                            角色名称
                        </label>
                    </div>
                </div>
                <div class="mt-3"> <!-- Added wrapper for button spacing -->
                    <button type="submit" class="btn btn-primary me-2"><i class="bi bi-check-circle-fill me-1"></i>保存角色</button>
                    <a th:href="@{/admin/users-list}" class="btn btn-secondary"><i class="bi bi-x-circle me-1"></i>取消</a>
                </div>
            </form>
        </div>
    </div>

</div>

</body>
</html>
