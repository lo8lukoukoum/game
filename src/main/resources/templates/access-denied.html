<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <title>访问被拒绝</title>
</head>
<body>

<div layout:fragment="content">
    <div class="container text-center py-5">
        <h1 class="display-4">🚫 访问被拒绝</h1>
        <p class="lead">抱歉，您没有权限访问此页面或执行此操作。</p>
        <p>如果您认为这是一个错误，请联系管理员。</p>
        <hr class="my-4">
        <a th:href="@{/}" class="btn btn-primary btn-lg">返回首页</a>
        <a th:href="@{/login}" class="btn btn-secondary btn-lg" th:if="${session.loggedInUser == null}">登录</a>
    </div>
</div>

</body>
</html>
