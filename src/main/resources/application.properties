# Database properties
spring.datasource.url=jdbc:mysql://localhost:3306/game_share?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# MyBatis properties
mybatis.mapper-locations=classpath:mappers/*.xml
mybatis.configuration.map-underscore-to-camel-case=true

# Spring SQL Initialization
# Ensure schema.sql and data.sql are run on startup
spring.sql.init.mode=always
# Optional: Specify schema and data script locations if not using default names or locations
# spring.sql.init.schema-locations=classpath:schema.sql
# spring.sql.init.data-locations=classpath:data.sql
# Defer initialization until after JPA EntityManagerFactory setup (if JPA was used)
# spring.sql.init.defer-datasource-initialization=true # Not strictly needed for MyBatis only
# Platform can be auto-detected, or set explicitly e.g. spring.sql.init.platform=mysql
